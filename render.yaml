# Render Blueprint - Naija Cars
# This file defines all services for deployment

databases:
  - name: naija-cars-db
    databaseName: naijacars
    user: naijacars
    plan: free
    region: oregon

services:
  # Backend API Service
  - type: web
    name: naija-cars-api
    runtime: node
    region: oregon
    plan: free
    rootDir: naija-cars-backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: naija-cars-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: naija-cars-web
    runtime: static
    plan: free
    rootDir: naija-cars-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
